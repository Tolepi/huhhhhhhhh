<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Startpage</title>

<style>

:root {
    --bg: #FDFCFD;

    --fg: #70748A;

    --blue: #99A0C0;
    --lavender: #D7C1FC;

    --peach: #F6D9C0;
    --cyan: #BDFCEF;
    --pink: #FA9096;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family: "Maple Mono NF", monospace;
}

body {
    background: var(--bg);

    color: var(--fg);

    height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.container {
    width: 700px;
}

.clock {
    text-align: center;

    font-size: 5rem;

    color: var(--blue);

    margin-bottom: 35px;

    font-weight: 600;
}

.search {
    margin-bottom: 35px;
}

.search input {
    width: 100%;

    border: 2px solid var(--lavender);

    background: white;

    color: var(--fg);

    border-radius: 16px;

    padding: 18px;

    font-size: 15px;

    outline: none;

    transition: .2s;
}

.search input:focus {
    border-color: var(--blue);
}

.links {
    display: grid;

    grid-template-columns: repeat(3, 1fr);

    gap: 15px;
}

.links a {
    text-decoration: none;

    text-align: center;

    color: var(--fg);

    padding: 14px;

    border-radius: 14px;

    transition: .2s;
}

.links a:nth-child(1) {
    background: var(--peach);
}

.links a:nth-child(2) {
    background: var(--cyan);
}

.links a:nth-child(3) {
    background: var(--lavender);
}

.links a:nth-child(4) {
    background: var(--pink);
    color: white;
}

.links a:nth-child(5) {
    background: var(--peach);
}

.links a:nth-child(6) {
    background: var(--cyan);
}

.links a:hover {
    transform: translateY(-2px);
}

</style>

</head>

<body>

<div class="container">

    <div class="clock" id="clock"></div>

    <form
        class="search"
        action="https://www.google.com/search"
        method="GET">

        <input
            type="text"
            name="q"
            placeholder="Search..."
            autocomplete="off">
    </form>

    <div class="links">

        <a href="https://github.com">
            GitHub
        </a>

        <a href="https://youtube.com">
            YouTube
        </a>

        <a href="https://reddit.com">
            Reddit
        </a>

        <a href="https://chatgpt.com">
            ChatGPT
        </a>

        <a href="https://archlinux.org">
            Arch
        </a>

        <a href="https://protondb.com">
            ProtonDB
        </a>

    </div>

</div>

<script>

function updateClock() {

    const now = new Date();

    document.getElementById("clock").textContent =
        now.toLocaleTimeString([], {
            hour: "2-digit",
            minute: "2-digit"
        });

}

updateClock();

setInterval(updateClock, 1000);

</script>

</body>
</html>
